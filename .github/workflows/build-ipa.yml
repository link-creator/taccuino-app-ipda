name: Build IPA (non firmato)
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install && npm run prep
      - run: npx cap add ios && npx cap sync ios
      - name: Icona e solo iPad
        run: |
          cp www/icons/icon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2"/TARGETED_DEVICE_FAMILY = 2/' ios/App/App.xcodeproj/project.pbxproj
      - name: Compila senza firma
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Taccuino.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: Taccuino-ipa, path: Taccuino.ipa }
