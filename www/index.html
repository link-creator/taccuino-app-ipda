<style>html,body{height:100%;height:100dvh;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

<style>
:root{--ac:#12b0ff;--bg:#f2f3f7;--cd:#fff;--tx:#1c1c1e;--sub:#8e8e93;--ln:#e3e4e8}
body.dk{--bg:#111214;--cd:#1e2024;--tx:#f2f2f5;--sub:#8b8d94;--ln:#2c2e33}
*{box-sizing:border-box}
body{margin:0;height:100vh;font-family:-apple-system,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.ib{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center}
.ib:hover{background:var(--ln)}.ib:active{transform:scale(.92)}.ib.on{background:var(--ac);color:#fff}
.pill{background:var(--ac);color:#fff;border-radius:20px;padding:9px 18px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
input,select{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:8px 12px;outline:0}
.hide{display:none!important}
/* libreria */
#lib{height:100%;display:flex;flex-direction:column;padding:26px 34px 0;position:relative}
#lh{display:flex;align-items:center;gap:12px}#lh h1{margin:0;font-size:34px;font-weight:800;flex:1}#q{width:230px}
#chips{display:flex;gap:8px;padding:18px 0 14px;overflow-x:auto}
.chip{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:7px 16px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}.chip .x{opacity:.6;font-size:15px}
#grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px;align-content:start;padding:6px 4px 40px}
.card{cursor:pointer;position:relative}
.card .th{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #0002;aspect-ratio:1/1.414;border:2px solid transparent}
.card:hover .th{border-color:var(--ac)}.card canvas{width:100%;height:100%;display:block}
.card b{display:block;margin:8px 4px 0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{margin:0 4px;color:var(--sub);font-size:12px}
.card .mo{position:absolute;top:6px;right:6px;width:30px;height:30px;background:#000a;color:#fff;border-radius:50%}.card .mo svg{width:18px;height:18px}
.card.new .th{display:flex;align-items:center;justify-content:center;border:2px dashed var(--ln);background:var(--cd);box-shadow:none;color:var(--ac)}
.card.new svg{width:38px;height:38px}#nbin{width:150px;padding:5px 12px;border-radius:20px}
/* editor */
#ed{height:100%;display:flex;flex-direction:column}
#nav{height:56px;display:flex;align-items:center;gap:6px;padding:0 14px;background:var(--cd);border-bottom:1px solid var(--ln)}
#nav .sp{flex:1}#title{text-align:center;font-weight:600;border:0;background:transparent;width:280px;font-size:16px}
#wrap{flex:1;overflow:auto;padding:30px 30px 20px 100px;background:var(--bg)}
#wrap{touch-action:none}#zs{position:relative;min-width:100%;margin:0 auto}
#pages{display:flex;flex-direction:column;align-items:center;gap:40px;width:max-content;position:absolute;top:50%;left:50%;transform-origin:50% 50%;transform:translate(-50%,-50%)}
.pg{position:relative;flex:none}.pg canvas{background:#fff;box-shadow:0 4px 22px #0004;border-radius:4px;touch-action:none;cursor:crosshair;display:block}
.pn{position:absolute;bottom:-26px;right:2px;font-size:12px;color:var(--sub)}
.pg input.tx{position:absolute;background:transparent;border:1px dashed var(--ac);border-radius:4px;padding:0 2px;min-width:140px;outline:0}
#more{height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--sub);font-size:12px;flex:none}
#more .ring{--p:0deg;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--ac) var(--p),var(--ln) 0);display:flex;align-items:center;justify-content:center}
#more button{width:54px;height:54px;border-radius:50%;background:var(--cd);color:var(--ac);display:flex;align-items:center;justify-content:center}
#more svg{width:26px;height:26px}
#tb{position:absolute;left:18px;top:76px;bottom:20px;display:flex;align-items:center;pointer-events:none;z-index:5}
#tbi{pointer-events:auto;background:var(--cd);border-radius:22px;box-shadow:0 6px 26px #0003;padding:10px 6px;display:flex;flex-direction:column;gap:3px;align-items:center;max-height:100%;overflow:auto}
.sw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:1px solid #0003;outline:2px solid transparent;outline-offset:1px;margin:2px 0;flex:none}.sw.on{outline-color:var(--tx)}
.cw{width:30px;height:30px;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);display:flex;align-items:center;justify-content:center;cursor:pointer;margin:4px 0;flex:none}
.cw i{width:14px;height:14px;border-radius:50%;border:2px solid var(--cd);display:block}
#tbi hr{width:26px;border:0;border-top:1px solid var(--ln);margin:6px 0}
#w{width:70px;transform:rotate(-90deg);margin:34px 0;padding:0;accent-color:var(--ac)}
#pop{position:fixed;z-index:30;background:var(--cd);border:1px solid var(--ln);border-radius:14px;box-shadow:0 10px 34px #0004;padding:8px;min-width:190px;max-height:90vh;overflow:auto}
#pop .row{padding:8px 12px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:14px}
#pop .row:hover{background:var(--ln)}#pop label{font-size:12px;color:var(--sub);display:block;margin:6px 12px 4px}
#pop .th{display:flex;gap:8px;padding:4px 12px}#pop .th i{width:24px;height:24px;border-radius:50%;cursor:pointer;display:block;border:2px solid var(--cd);outline:2px solid transparent}#pop .th i.on{outline-color:var(--tx)}
#pop select{width:calc(100% - 24px);margin:0 12px}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:6px 8px}.pal i{aspect-ratio:1;border-radius:50%;cursor:pointer;border:1px solid #0003;display:block}
#wh{display:block;margin:8px auto;cursor:crosshair;border-radius:50%}
#pop input[type=range]{width:100%;padding:0;accent-color:var(--ac)}#hx{width:100%;margin-top:6px;text-align:center}
.selbar{position:absolute;display:flex;gap:2px;background:var(--cd);border:1px solid var(--ln);border-radius:12px;box-shadow:0 6px 20px #0004;padding:4px;z-index:6;white-space:nowrap}
.selbar button{padding:6px 10px;border-radius:8px;font-size:13px}.selbar button:hover{background:var(--ln)}
#rc:empty::after{content:'—';color:var(--sub);font-size:12px;grid-column:1/-1}
#tbi .ib{width:34px;height:34px}#w{margin:28px 0}
#busy{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center}#busy div{background:var(--cd);color:var(--tx);padding:22px 34px;border-radius:16px;font-weight:600}
#lib.drop{outline:3px dashed var(--ac);outline-offset:-10px}
button.g{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:8px 14px}
#dlg{position:fixed;inset:0;background:#000a;z-index:60;display:flex;align-items:center;justify-content:center}
#dlg .box{background:var(--cd);color:var(--tx);border-radius:22px;padding:24px;width:min(92vw,440px);max-height:88vh;overflow:auto;box-shadow:0 20px 60px #0007}
#dlg h2{margin:0 0 4px;font-size:22px}#dlg label{display:block;font-size:12px;color:var(--sub);margin:14px 2px 5px}#dlg .sub{color:var(--sub);margin:0}
.uses{display:flex;flex-wrap:wrap;gap:8px}.uses .chip{cursor:pointer}
.err{color:#e63946;font-size:13px;min-height:18px;margin-top:10px}.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.chip.over{outline:2px solid var(--ac);transform:scale(1.08)}
.ghost{position:fixed;z-index:80;pointer-events:none;width:110px;height:155px;border-radius:10px;background:#fff;box-shadow:0 10px 30px #0006;transform:rotate(4deg)}
#trbtn{position:absolute;right:calc(26px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--cd);box-shadow:0 6px 22px #0004;display:flex;align-items:center;justify-content:center;z-index:8}
#trbtn svg{width:26px;height:26px}#trbtn .bdg{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--ac);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.trow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.trow canvas{width:46px;height:65px;border-radius:6px;background:#fff;box-shadow:0 1px 5px #0003;flex:none}
.trow .tt{flex:1;min-width:0}.trow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trow small{color:var(--sub)}.trow button.g{padding:7px 12px;font-size:13px;border-radius:10px}
#ercur{position:fixed;display:none;border:1.5px solid var(--ac);background:#12b0ff22;border-radius:50%;pointer-events:none;z-index:40}
.geo{display:grid;grid-template-columns:repeat(4,78px);gap:6px;padding:4px 8px 8px}.gb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:12px;font-size:10px;line-height:1.1;text-align:center;border:1px solid var(--ln)}.gb.on{background:var(--ac);color:#fff;border-color:var(--ac)}

/* animazioni */
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes fadeout{to{opacity:0;transform:scale(1.03)}}
@keyframes popin{from{opacity:0;transform:scale(.92) translateY(-6px)}to{opacity:1;transform:none}}
@keyframes boxin{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
@keyframes cardin{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes edin{from{opacity:0;transform:scale(.985) translateY(10px)}to{opacity:1;transform:none}}
@keyframes libin{from{opacity:0;transform:scale(1.015)}to{opacity:1;transform:none}}
@keyframes tbin{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes tabpop{0%{transform:scale(.8)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes inr{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes inl{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes logo{from{opacity:0;transform:scale(.3) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes blob{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.15)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes ckc{from{stroke-dashoffset:150}to{stroke-dashoffset:0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ib,.pill,.chip,button.g,.sw,.cw,.gb,#pop .row{transition:background .18s,transform .15s,box-shadow .2s,border-color .2s,color .2s}
.ib.on{animation:tabpop .28s}.pill:hover{box-shadow:0 4px 14px #0003;transform:translateY(-1px)}.pill:active{transform:scale(.95)}
.chip:hover{transform:translateY(-1px)}.chip:active{transform:scale(.95)}.sw:hover,.cw:hover{transform:scale(1.18)}.gb:hover{transform:translateY(-2px);border-color:var(--ac)}
#lib:not(.hide){animation:libin .35s ease-out}#ed:not(.hide){animation:edin .35s ease-out}
#tbi{animation:tbin .5s cubic-bezier(.2,.9,.3,1) both}#nav{animation:fade .4s}
.card{animation:cardin .45s cubic-bezier(.2,.9,.3,1) both}.card:nth-child(1){animation-delay:45ms}.card:nth-child(2){animation-delay:90ms}.card:nth-child(3){animation-delay:135ms}.card:nth-child(4){animation-delay:180ms}.card:nth-child(5){animation-delay:225ms}.card:nth-child(6){animation-delay:270ms}.card:nth-child(7){animation-delay:315ms}.card:nth-child(8){animation-delay:360ms}.card:nth-child(9){animation-delay:405ms}.card:nth-child(10){animation-delay:450ms}.card:nth-child(11){animation-delay:495ms}.card:nth-child(12){animation-delay:540ms}.card:nth-child(13){animation-delay:585ms}.card:nth-child(14){animation-delay:630ms}.card:nth-child(15){animation-delay:675ms}
.card .th{transition:transform .22s cubic-bezier(.2,.9,.3,1),box-shadow .22s,border-color .2s}.card:hover .th{transform:translateY(-5px);box-shadow:0 10px 24px #0003}.card:active .th{transform:scale(.97)}
.card.new:hover svg{transform:rotate(90deg) scale(1.1)}.card.new svg{transition:transform .3s}
#pop:not(.hide){animation:popin .17s ease-out;transform-origin:top right}.selbar{animation:popin .17s ease-out}
#dlg:not(.hide){animation:fade .25s}#dlg:not(.hide) .box{animation:boxin .4s cubic-bezier(.2,1.2,.4,1)}
#busy:not(.hide){animation:fade .2s}.trow{animation:up .3s both}#trbtn{transition:transform .2s}#trbtn:hover{transform:scale(1.08)}#trbtn:active{transform:scale(.92)}
#trbtn .bdg{animation:tabpop .4s}
#ob,#lock{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;animation:fade .45s}#lock{z-index:90}
#ob.out,#lock.out{animation:fadeout .38s forwards}
#ob .b1,#ob .b2,#lock .b1,#lock .b2{position:absolute;width:420px;height:420px;border-radius:50%;background:var(--ac);filter:blur(90px);opacity:.28;animation:blob 9s ease-in-out infinite}
#ob .b1,#lock .b1{left:-120px;top:-100px}#ob .b2,#lock .b2{right:-140px;bottom:-120px;animation-delay:-4s;background:#7c5cff}
.obp{position:absolute;top:env(safe-area-inset-top,0);left:0;right:0;height:5px;background:var(--ln)}.obp div{height:100%;width:0;background:var(--ac);border-radius:0 3px 3px 0;transition:width .55s cubic-bezier(.2,.9,.3,1)}
.obc{position:relative;width:min(92vw,460px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.obs{min-height:340px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.obs.inr{animation:inr .5s cubic-bezier(.2,.9,.3,1) both}.obs.inl{animation:inl .5s cubic-bezier(.2,.9,.3,1) both}
.obs h1{font-size:38px;margin:6px 0 0;font-weight:800}.obs h2,.obc>h2{font-size:28px;margin:0;font-weight:800}.obs p{color:var(--sub);margin:0;max-width:380px;line-height:1.45;font-size:16px}
.obs>*{animation:up .5s both}.obs>*:nth-child(2){animation-delay:.08s}.obs>*:nth-child(3){animation-delay:.16s}.obs>*:nth-child(4){animation-delay:.24s}
.logo{width:120px;height:120px;border-radius:28px;box-shadow:0 14px 40px #0005;animation:logo 1s cubic-bezier(.2,1.5,.4,1) both}
.big{width:100px;height:100px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px #12b0ff55}.big svg{width:48px;height:48px;stroke-width:1.6}
.obs .big{animation:logo .7s cubic-bezier(.2,1.5,.4,1) both,floaty 3.2s ease-in-out .8s infinite}
.obs input{width:100%;font-size:24px;text-align:center;padding:14px;border-radius:16px;margin-top:6px}
.obe{color:#e63946;min-height:22px;font-size:14px}.obn{display:flex;gap:10px;justify-content:center;margin-top:4px;min-height:48px}.obn .pill{padding:13px 32px;font-size:16px}.obn .g{padding:12px 20px}
.obn2{display:flex;flex-direction:column;gap:10px;margin-top:6px}.obn2 .pill{padding:13px 32px;font-size:16px;justify-content:center}.obn2 .g{padding:12px}
.ck{width:110px;height:110px;fill:none;stroke:var(--ac);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ck circle,.ck path{stroke-dasharray:150;animation:ckc .8s .2s ease-out both}.ck path{animation-delay:.7s}
.dots{display:flex;gap:16px;justify-content:center;margin:12px 0 18px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ac);transition:.15s;display:block}.dots i.on{background:var(--ac);transform:scale(1.2)}.dots.sh{animation:shake .4s}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:12px;justify-content:center}.pad button{height:74px;border-radius:50%;background:var(--cd);border:1px solid var(--ln);font-size:26px;transition:transform .1s,background .1s}.pad button:active{transform:scale(.9);background:var(--ln)}.pad button.e{visibility:hidden}
.uses{justify-content:center}
.edb{font-size:11px;font-weight:800;letter-spacing:1px;background:var(--ac);color:#fff;border-radius:8px;padding:3px 8px;margin-left:10px;vertical-align:middle;display:inline-block;animation:tabpop .5s}
.kin{letter-spacing:2px;font-size:20px!important}
.ruler{position:absolute;left:0;top:0;height:64px;transform-origin:0 0;pointer-events:none;z-index:4;background:linear-gradient(#fffd,#fff8);border:1px solid #0007;border-radius:4px;box-shadow:0 6px 18px #0004;animation:fade .25s}
.ruler::before{content:'';position:absolute;left:0;right:0;top:0;height:9px;background:repeating-linear-gradient(90deg,#000 0 1px,transparent 1px 4.7619px)}
.ruler::after{content:'';position:absolute;left:0;right:0;top:0;height:20px;background:repeating-linear-gradient(90deg,#000 0 1.5px,transparent 1.5px 47.619px)}
.ruler span{position:absolute;top:22px;font-size:12px;color:#000;transform:translateX(-50%);font-weight:600}.ruler span:first-child{transform:translateX(3px)}
.ruler u{position:absolute;right:30px;top:22px;font-size:11px;color:#555;text-decoration:none}
.ruler .rg{position:absolute;left:0;right:0;top:36px;bottom:0;pointer-events:auto;cursor:grab;touch-action:none}
.ruler .rx{position:absolute;left:6px;top:36px;width:24px;height:24px;line-height:22px;text-align:center;font-style:normal;font-size:20px;color:#e63946;pointer-events:auto;cursor:pointer;z-index:2}
.ruler .rh{position:absolute;right:-16px;top:16px;width:32px;height:32px;border-radius:50%;background:var(--ac);border:3px solid #fff;box-shadow:0 2px 8px #0005;pointer-events:auto;cursor:grab;touch-action:none}
.sgl{display:grid;grid-template-columns:repeat(2,130px);gap:10px;padding:8px 8px 4px}.sgi{position:relative;background:#fff;border:1px solid var(--ln);border-radius:10px;padding:6px;cursor:pointer;height:64px;display:flex;align-items:center;justify-content:center;transition:transform .15s,border-color .2s}.sgi:hover{transform:translateY(-2px);border-color:var(--ac)}.sgi img{max-width:100%;max-height:100%}
.sgi b{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:#e63946;color:#fff;font-size:14px;line-height:22px;text-align:center}.sgn{padding:10px 14px;color:var(--sub);font-size:13px;grid-column:1/-1}
#pst{animation:tabpop .3s}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* v1.12 — barra galleggiante liquid glass */
#ed{position:relative}
#hud{position:absolute;z-index:8;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),1180px);border-radius:28px;padding:6px 8px 8px;display:flex;flex-direction:column;gap:4px;
 background:linear-gradient(160deg,rgba(255,255,255,.62),rgba(255,255,255,.34) 55%,color-mix(in srgb,var(--ac) 16%,rgba(255,255,255,.3)));
 -webkit-backdrop-filter:blur(30px) saturate(190%) brightness(1.04);backdrop-filter:blur(30px) saturate(190%) brightness(1.04);
 border:1px solid rgba(255,255,255,.7);box-shadow:0 12px 40px rgba(18,60,100,.22),0 1px 0 rgba(255,255,255,.9) inset,0 -1px 0 rgba(255,255,255,.25) inset;animation:hudin .5s cubic-bezier(.2,.9,.3,1) both}
@keyframes hudin{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translate(-50%,0)}}
#hud::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 80% at 12% -20%,rgba(255,255,255,.75),transparent 55%)}
body.dk #hud{background:linear-gradient(160deg,rgba(60,66,78,.58),rgba(28,30,36,.46) 55%,color-mix(in srgb,var(--ac) 22%,rgba(28,30,36,.5)));border-color:rgba(255,255,255,.16);box-shadow:0 12px 40px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.18) inset}
body.dk #hud::before{background:radial-gradient(120% 80% at 12% -20%,rgba(255,255,255,.14),transparent 55%)}
#hud>*{position:relative}
#hud #nav{height:44px;background:transparent;border:0;padding:0 4px;animation:none}
#hud #title{width:220px;background:transparent}
#htabs{display:flex;gap:6px;overflow-x:auto;padding:2px 4px;scrollbar-width:none}#htabs::-webkit-scrollbar{display:none}
.ht{flex:none;display:flex;align-items:center;gap:8px;max-width:210px;padding:6px 8px 6px 13px;border-radius:16px;font-size:13px;font-weight:600;color:var(--tx);background:color-mix(in srgb,var(--cd) 38%,transparent);border:1px solid color-mix(in srgb,var(--cd) 55%,transparent);cursor:pointer;transition:background .2s,transform .15s}
.ht:active{transform:scale(.96)}.ht.on{background:var(--ac);color:#fff;border-color:transparent;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 55%,transparent)}
.ht span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ht b{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;opacity:.6;font-weight:700}.ht b:hover{background:#0002;opacity:1}
.ht.plus{padding:6px 12px;color:var(--ac);font-size:16px;line-height:1}
#hud #tb{position:static;display:block;pointer-events:auto;padding:0}
#hud #tbi{flex-direction:row;background:color-mix(in srgb,var(--cd) 34%,transparent);border:1px solid color-mix(in srgb,var(--cd) 55%,transparent);box-shadow:none;border-radius:20px;padding:5px 10px;gap:4px;overflow-x:auto;overflow-y:hidden;max-height:none;animation:none;scrollbar-width:none;align-items:center}
#hud #tbi::-webkit-scrollbar{display:none}
#hud #tbi .ib{width:40px;height:40px;flex:none}#hud #tbi .ib.on{box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 55%,transparent)}
#hud #tbi hr{width:0;height:26px;border:0;border-left:1px solid color-mix(in srgb,var(--tx) 18%,transparent);margin:0 6px}
#hud #tbi .sw{margin:0 2px}#hud #tbi .cw{margin:0 4px}
#hud #w{transform:none;width:96px;margin:0 6px;flex:none}
#wrap{padding:calc(var(--hh,170px) + 22px) 30px 20px 30px!important}
#hud .ib:hover{background:color-mix(in srgb,var(--cd) 55%,transparent)}
#hud .ib.on:hover{background:var(--ac)}

   const pt=(u,w)=>[mx2+u*ux-w*uy,my2+u*uy+w*ux];const o=[pt(u0,w0),pt(u1,w0),pt(u1,w1),pt(u0,w1)];o.push(o[0]);return{p:o,ln:1}}}

  case 'meas':{const n=Math.atan2(b[1]-a[1],b[0]-a[0])+Math.PI/2,tx=Math.cos(n)*(s.pv?3:9),ty=Math.sin(n)*(s.pv?3:9);return[[a,b],[[a[0]-tx,a[1]-ty],[a[0]+tx,a[1]+ty]],[[b[0]-tx,b[1]-ty],[b[0]+tx,b[1]+ty]]]}

function eraseAt(pi,pt,mode,rad){const a=note().pages[pi].strokes,R=rad||erRad(),out=[];let ch=false;

function cropStart(){const im=selStrokes().find(x=>x.k==='img');if(!im)return;const pg=SEL.pg;clearBars();CROP={pg,img:im,a:null,b:null};
 const d=document.createElement('div');d.className='selbar';d.innerHTML='<span style="padding:6px 10px;font-size:13px">'+T.cropH+'</span>';
 const x=document.createElement('button');x.textContent=T.cancel;x.onclick=e=>{e.stopPropagation();CROP=null;clearBars();selBar();redrawPage(pg)};d.append(x);
 cvs[pg].parentNode.append(d);const b=selBox();d.style.left=Math.max(0,Math.min(W-d.offsetWidth,b.x))+'px';d.style.top=(b.y>56?b.y-52:b.y+b.h+12)+'px';redrawPage(pg)}
function finishCrop(pi){const C=CROP;if(!C||!C.a)return;const s=C.img,x0=Math.max(s.x,Math.min(C.a[0],C.b[0])),y0=Math.max(s.y,Math.min(C.a[1],C.b[1])),x1=Math.min(s.x+s.w,Math.max(C.a[0],C.b[0])),y1=Math.min(s.y+s.h,Math.max(C.a[1],C.b[1])),w=x1-x0,h=y1-y0;
 if(w<8||h<8){CROP=null;clearBars();selBar();redrawPage(pi);return}
 const o=imgObj(s.d);if(!o.ok){CROP=null;redrawPage(pi);return}
 const r=o.i.naturalWidth/s.w,sw=Math.max(1,Math.round(w*r)),sh=Math.max(1,Math.round(h*r)),c=document.createElement('canvas');c.width=sw;c.height=sh;c.getContext('2d').drawImage(o.i,(x0-s.x)*r,(y0-s.y)*r,sw,sh,0,0,sw,sh);
 const nd=c.toDataURL(/^data:image\/jpe?g/.test(s.d)?'image/jpeg':'image/png',.92);
 CROP=null;clearBars();clip=[{k:'img',d:nd,x:x0,y:y0,w,h}];updPaste();pasteClip(24)}
